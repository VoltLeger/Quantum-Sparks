name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег для ручной сборки релиза (например: v1.2.0)'
        required: false
        default: 'v1.2.0'
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: 🚀 Build Debug APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Build Web Application (Vite)
        run: |
          npm run build

      - name: 📲 Prepare Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Папка android не найдена, инициализируем платформу Android..."
            npx cap add android
          fi
          npx cap sync android
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/coreSplashScreenVersion = '1.2.0'/coreSplashScreenVersion = '1.0.1'/g" android/variables.gradle || true
          fi

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📜 Accept Android SDK Licenses & Install Components
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_SDK/licenses" || true
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - name: 🔑 Prepare environment & permanent signing keystore
        run: |
          touch .env
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs
          if [ ! -f "android/app/quantum_sparks.keystore" ]; then
            echo "Восстановление постоянного keystore из защищенной сигнатуры..."
            echo "" | base64 -d > android/app/quantum_sparks.keystore
          fi
          sed -i -e 's/\r$//' android/gradlew || true
          chmod +x android/gradlew

      - name: 🏷️ Resolve Version Name & Auto-increment Version Code
        run: |
          VERSION_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "null" ]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              VERSION_TAG="${{ inputs.release_tag }}"
            else
              PKG_VER=$(node -p "require('./package.json').version || '1.2.1'")
              VERSION_TAG="v${PKG_VER}"
            fi
          fi

          # Вычисляем строго возрастающий versionCode: базовое смещение 120 + github.run_number
          RUN_NUM="${{ github.run_number }}"
          if [ -z "$RUN_NUM" ]; then RUN_NUM=1; fi
          CALC_VERSION_CODE=$(( RUN_NUM + 120 ))
          RAW_VERSION_NAME="${VERSION_TAG#v}"

          echo "RESOLVED_VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${RAW_VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${CALC_VERSION_CODE}" >> $GITHUB_ENV

          echo "=================================================="
          echo "Building APK for Quantum Sparks"
          echo "Release Tag:  ${VERSION_TAG}"
          echo "Version Name: ${RAW_VERSION_NAME}"
          echo "Version Code: ${CALC_VERSION_CODE}"
          echo "=================================================="

      - name: 🏗️ Build Debug APK with Gradle (Permanent Sign & Auto VersionCode)
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          echo "Building Gradle with VERSION_CODE=${VERSION_CODE} and VERSION_NAME=${VERSION_NAME}"
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: 📦 Prepare APK for distribution
        run: |
          mkdir -p release-artifacts

          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Не удалось найти собранный APK файл!"
            exit 1
          fi

          echo "Найден APK: $APK_FILE"
          cp "$APK_FILE" "release-artifacts/QuantumSparks-${RESOLVED_VERSION_TAG}.apk"
          cp "$APK_FILE" release-artifacts/QuantumSparks-latest.apk
          ls -la release-artifacts/

      - name: 📤 Upload Debug APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: QuantumSparks-Debug-APK
          path: release-artifacts/*.apk
          retention-days: 14

      - name: 🚀 Publish or Update GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Quantum Sparks ${{ env.RESOLVED_VERSION_TAG }}
          tag_name: ${{ env.RESOLVED_VERSION_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
