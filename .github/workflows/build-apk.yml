name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег для ручной сборки релиза (например: v1.2.0)'
        required: false
        default: 'v1.2.0'
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: 🚀 Build Debug APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Build Web Application (Vite)
        run: |
          npm run build

      - name: 📲 Prepare Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Папка android не найдена, инициализируем платформу Android..."
            npx cap add android
          fi
          npx cap sync android

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📜 Accept Android SDK Licenses & Install Components
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_SDK/licenses" || true
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: 🔑 Prepare environment & debug keystore
        run: |
          touch .env
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          cd android
          mkdir -p app
          if [ ! -f "app/debug.keystore" ]; then
            cp ~/.android/debug.keystore app/debug.keystore || true
          fi
          chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: 📦 Prepare APK for distribution
        run: |
          mkdir -p release-artifacts
          
          # Определение версии и тега (ровно один релиз)
          VERSION_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "null" ]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              VERSION_TAG="${{ inputs.release_tag }}"
            else
              PKG_VER=$(node -p "require('./package.json').version || '1.2.0'")
              VERSION_TAG="v${PKG_VER}"
            fi
          fi

          echo "RESOLVED_VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

          # Поиск собранного APK
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Не удалось найти собранный APK файл!"
            exit 1
          fi

          echo "Найден APK: $APK_FILE"
          cp "$APK_FILE" release-artifacts/QuantumSparks-${VERSION_TAG}.apk
          cp "$APK_FILE" release-artifacts/QuantumSparks-latest.apk
          ls -la release-artifacts/

      - name: 📤 Upload Debug APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: QuantumSparks-Debug-APK
          path: release-artifacts/*.apk
          retention-days: 14

      - name: 🚀 Publish or Update GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Quantum Sparks ${{ env.RESOLVED_VERSION_TAG }}
          tag_name: ${{ env.RESOLVED_VERSION_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
